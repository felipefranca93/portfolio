    <script>
        (() => {
            const languageSelect = document.getElementById('page-language');
            let savedLanguage = 'pt';

            try {
                savedLanguage = localStorage.getItem('language') || 'pt';
            } catch {
                savedLanguage = 'pt';
            }

            const applyLanguage = language => {
                const safeLanguage = ['pt', 'en', 'es'].includes(language) ? language : 'pt';
                document.documentElement.lang = safeLanguage === 'pt' ? 'pt-BR' : safeLanguage;
                document.querySelectorAll('[data-pt]').forEach(element => {
                    element.textContent = element.getAttribute(`data-${safeLanguage}`) || element.textContent;
                });
                languageSelect.value = safeLanguage;
            };

            applyLanguage(savedLanguage);
            languageSelect.addEventListener('change', event => {
                applyLanguage(event.target.value);
                try {
                    localStorage.setItem('language', event.target.value);
                } catch {
                    // Language still changes for this page when storage is unavailable.
                }
            });
        })();
    </script>
