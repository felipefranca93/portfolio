on:
  push:
    branches:
      - "main"

jobs:
   Build_and_Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx.Dockerfile

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: www/

        
          