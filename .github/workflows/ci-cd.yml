on:
  push:
    branches:
      - "main"

jobs:
   Build_and_Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          file: nginx.Dockerfile

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages
          folder: .

        
          